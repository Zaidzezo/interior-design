services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buildspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildspace_local}
      POSTGRES_DB: buildspace
    ports: ["127.0.0.1:${BUILDSPACE_DB_PORT:-5432}:5432"]
    volumes: ["buildspace-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildspace"]
      interval: 3s
      retries: 10
volumes:
  buildspace-db:
